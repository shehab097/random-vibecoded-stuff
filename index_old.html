<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory File Explorer</title>
    
    <style>
        :root {
            --bg: #121212;
            --text: #e0e0e0;
            --link: #66b3ff;
            --link-hover: #99ccff;
            --folder: #a0a0a0;
            --border: #333333;
            --hover: #1e1e1e;
            --meta: #888888;
            --accent: #ff6b6b;
            --badge-bg: #222;
        }

        body {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem 1rem;
            line-height: 1.5;
            font-size: 14px;
        }

        .app-container {
            max-width: 850px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px dashed var(--border);
        }

        h1 {
            font-size: 1.2rem;
            margin: 0 0 0.5rem 0;
            font-weight: bold;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--meta);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .status-badge {
            display: inline-block;
            background: var(--badge-bg);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            color: var(--link);
            font-size: 0.75rem;
        }

        .node {
            margin-left: 1.25rem;
            border-left: 1px dotted var(--border);
            padding-left: 0.5rem;
        }

        .node.root {
            margin-left: 0;
            border-left: none;
            padding-left: 0;
        }

        .folder-header {
            cursor: pointer;
            padding: 0.35rem 0.5rem;
            display: flex;
            align-items: center;
            border-radius: 4px;
            user-select: none;
            transition: background 0.2s;
        }

        .folder-header:hover {
            background: var(--hover);
        }

        .folder-icon {
            font-weight: bold;
            color: var(--folder);
            margin-right: 0.5rem;
            width: 1.2rem;
        }

        .folder-name {
            font-weight: bold;
        }

        .folder-children {
            display: none;
            padding-top: 0.25rem;
            padding-bottom: 0.25rem;
        }

        .folder-children.open {
            display: block;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.35rem 0.5rem;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .file-item:hover {
            background: var(--hover);
        }

        .file-main {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .file-icon {
            color: var(--meta);
            width: 1.2rem;
        }

        .file-link {
            color: var(--link);
            text-decoration: none;
        }

        .file-link:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }

        /* Highlight index.html */
        .file-link.index-file {
            color: var(--accent);
            font-weight: bold;
        }

        .file-meta {
            font-size: 0.85rem;
            color: var(--meta);
            white-space: nowrap;
            margin-left: 1rem;
        }

        .search-wrapper {
            margin: 0.5rem 0 0.5rem 0.5rem;
        }

        .search-input {
            width: calc(100% - 1rem);
            max-width: 280px;
            padding: 0.3rem 0.5rem;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            border-radius: 4px;
        }

        .search-input:focus {
            border-color: var(--link);
        }

        .empty-folder {
            color: var(--meta);
            font-style: italic;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }

        .startup-prompt {
            text-align: center;
            padding: 3rem 1.5rem;
            background: var(--hover);
            border-radius: 8px;
            border: 1px dashed var(--border);
            margin-top: 1.5rem;
        }

        .custom-file-upload {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            background: var(--text);
            color: var(--bg);
            border-radius: 4px;
            font-weight: bold;
            margin-top: 1rem;
        }

        input[type="file"] {
            display: none;
        }

        .loader {
            color: var(--link);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1 id="app-title">~/Repository_Explorer</h1>
            <div class="subtitle" id="app-subtitle">
                <span>Auto-parsing files & folders...</span>
                <span class="status-badge" id="mode-badge">Checking environment...</span>
            </div>
        </header>
        
        <main id="tree-container">
            <div class="startup-prompt">
                <span class="loader">[ Processing Repository Contents... ]</span>
            </div>
        </main>
    </div>

    <script>
        
        // Helper to format bytes
        function formatBytes(bytes, decimals = 2) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        }

        // Sort nodes: index.html strictly first, then folders, then files alphabetically
        function sortNodes(nodes) {
            return nodes.sort((a, b) => {
                const aIsIndex = a.name.toLowerCase() === 'index.html';
                const bIsIndex = b.name.toLowerCase() === 'index.html';

                if (aIsIndex && !bIsIndex) return -1;
                if (!aIsIndex && bIsIndex) return 1;

                if (a.type === 'folder' && b.type === 'file') return -1;
                if (a.type === 'file' && b.type === 'folder') return 1;

                return a.name.localeCompare(b.name);
            });
        }

        function renderNode(node, isRoot = false) {
            const wrapper = document.createElement('div');
            wrapper.className = 'node' + (isRoot ? ' root' : '');
            wrapper.dataset.name = node.name.toLowerCase();

            if (node.type === 'folder') {
                const header = document.createElement('div');
                header.className = 'folder-header';
                
                const icon = document.createElement('span');
                icon.className = 'folder-icon';
                icon.textContent = '[+]';
                
                const name = document.createElement('span');
                name.className = 'folder-name';
                name.textContent = node.name + '/';
                
                header.appendChild(icon);
                header.appendChild(name);

                const childrenContainer = document.createElement('div');
                childrenContainer.className = 'folder-children';

                header.addEventListener('click', () => {
                    const isOpen = childrenContainer.classList.toggle('open');
                    icon.textContent = isOpen ? '[-]' : '[+]';
                });

                wrapper.appendChild(header);

                if (node.children && node.children.length > 0) {
                    // Specific Folder-Only Search Box
                    const searchWrapper = document.createElement('div');
                    searchWrapper.className = 'search-wrapper';
                    
                    const searchInput = document.createElement('input');
                    searchInput.type = 'text';
                    searchInput.className = 'search-input';
                    searchInput.placeholder = `Search in ${node.name}/...`;
                    
                    searchInput.addEventListener('input', (e) => {
                        const query = e.target.value.toLowerCase();
                        Array.from(itemsWrapper.children).forEach(childWrapper => {
                            const childName = childWrapper.dataset.name || '';
                            if (childName.includes(query)) {
                                childWrapper.style.display = 'block';
                            } else {
                                childWrapper.style.display = 'none';
                            }
                        });
                    });

                    searchWrapper.appendChild(searchInput);
                    childrenContainer.appendChild(searchWrapper);

                    const itemsWrapper = document.createElement('div');
                    const sortedChildren = sortNodes(node.children);
                    sortedChildren.forEach(child => {
                        itemsWrapper.appendChild(renderNode(child));
                    });
                    
                    childrenContainer.appendChild(itemsWrapper);
                } else {
                    const empty = document.createElement('div');
                    empty.className = 'empty-folder';
                    empty.textContent = '(empty folder)';
                    childrenContainer.appendChild(empty);
                }

                wrapper.appendChild(childrenContainer);
                
                if (isRoot) {
                    childrenContainer.classList.add('open');
                    icon.textContent = '[-]';
                }

            } else {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';

                const mainDiv = document.createElement('div');
                mainDiv.className = 'file-main';

                const fileIcon = document.createElement('span');
                fileIcon.className = 'file-icon';
                fileIcon.innerHTML = '&#128196;';

                const link = document.createElement('a');
                link.className = 'file-link';
                if (node.name.toLowerCase() === 'index.html') {
                    link.classList.add('index-file');
                }
                
                link.href = node.url || '#';
                link.target = '_blank';
                link.textContent = node.name;

                mainDiv.appendChild(fileIcon);
                mainDiv.appendChild(link);

                const meta = document.createElement('span');
                meta.className = 'file-meta';
                meta.textContent = node.size ? formatBytes(node.size) : '';

                fileItem.appendChild(mainDiv);
                fileItem.appendChild(meta);
                wrapper.appendChild(fileItem);
            }

            return wrapper;
        }

        const treeContainer = document.getElementById('tree-container');
        const modeBadge = document.getElementById('mode-badge');

        // Check if hosted on GitHub Pages or web host
        async function tryGitHubAutoFetch() {
            const host = window.location.hostname;
            const pathname = window.location.pathname;

            // Check if page is hosted on github.io
            if (host.endsWith('.github.io')) {
                const owner = host.split('.')[0];
                const repo = pathname.split('/')[1] || '';

                if (owner && repo) {
                    modeBadge.textContent = 'GitHub API Mode';
                    try {
                        const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/main?recursive=1`);
                        if (!response.ok) throw new Error('Repository tree fetch failed');
                        
                        const data = await response.json();
                        const root = { name: repo, type: 'folder', children: [] };

                        data.tree.forEach(item => {
                            const parts = item.path.split('/');
                            let current = root;

                            parts.forEach((part, index) => {
                                const isLast = index === parts.length - 1;
                                if (isLast) {
                                    if (item.type === 'blob') {
                                        current.children.push({
                                            name: part,
                                            type: 'file',
                                            size: item.size,
                                            url: `https://raw.githack.com/${owner}/${repo}/main/${item.path}`
                                        });
                                    }
                                } else {
                                    let folder = current.children.find(c => c.name === part && c.type === 'folder');
                                    if (!folder) {
                                        folder = { name: part, type: 'folder', children: [] };
                                        current.children.push(folder);
                                    }
                                    current = folder;
                                }
                            });
                        });

                        treeContainer.innerHTML = '';
                        treeContainer.appendChild(renderNode(root, true));
                        return true;
                    } catch (err) {
                        console.warn('GitHub API parsing failed, falling back to local mode', err);
                    }
                }
            }
            return false;
        }

        // Render Local Folder Input Prompt
        function renderLocalPicker() {
            modeBadge.textContent = 'Local Mode';
            treeContainer.innerHTML = `
                <div class="startup-prompt">
                    <h2 style="margin-top:0; font-size:1.1rem;">Local File System Detection</h2>
                    <p style="color:var(--meta); font-size:0.85rem;">
                        Browsers block JS from automatically reading local disks without user input.<br>
                        Click below to grant access to the folder where this <code>index.html</code> file resides.
                    </p>
                    <label class="custom-file-upload">
                        Select Current Folder...
                        <input type="file" id="folderInput" webkitdirectory directory multiple />
                    </label>
                </div>
            `;

            document.getElementById('folderInput').addEventListener('change', (e) => {
                const files = e.target.files;
                if (files.length > 0) {
                    const root = { name: 'Current_Folder', type: 'folder', children: [] };

                    for (let i = 0; i < files.length; i++) {
                        const file = files[i];
                        const parts = file.webkitRelativePath.split('/');
                        let current = root;

                        for (let j = 0; j < parts.length; j++) {
                            const part = parts[j];
                            if (j === parts.length - 1) {
                                current.children.push({
                                    name: part,
                                    type: 'file',
                                    size: file.size,
                                    url: URL.createObjectURL(file)
                                });
                            } else {
                                let folder = current.children.find(c => c.name === part && c.type === 'folder');
                                if (!folder) {
                                    folder = { name: part, type: 'folder', children: [] };
                                    current.children.push(folder);
                                }
                                current = folder;
                            }
                        }
                    }

                    treeContainer.innerHTML = '';
                    const displayTree = (root.children.length === 1 && root.children[0].type === 'folder') ? root.children[0] : root;
                    treeContainer.appendChild(renderNode(displayTree, true));
                }
            });
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const success = await tryGitHubAutoFetch();
            if (!success) {
                renderLocalPicker();
            }
        });
    </script>
</body>
</html>
