<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository Explorer & Live Preview</title>
    
    <style>
        :root {
            --bg: #121212;
            --text: #e0e0e0;
            --link: #66b3ff;
            --link-hover: #99ccff;
            --folder: #a0a0a0;
            --border: #333333;
            --hover: #1e1e1e;
            --meta: #888888;
            --accent: #ff6b6b;
            --badge-bg: #222;
            --active-bg: #262626;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 1rem;
            height: 100vh;
            overflow: hidden;
            line-height: 1.5;
            font-size: 13px;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 2rem);
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 0.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.1rem;
            margin: 0 0 0.25rem 0;
            font-weight: bold;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--meta);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .status-badge {
            display: inline-block;
            background: var(--badge-bg);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            color: var(--link);
            font-size: 0.75rem;
        }

        .workspace {
            display: flex;
            flex: 1;
            gap: 1rem;
            overflow: hidden;
        }

        .sidebar {
            width: 420px;
            min-width: 320px;
            overflow-y: auto;
            border-right: 1px dashed var(--border);
            padding-right: 0.75rem;
        }

        .preview-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--hover);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
        }

        .preview-header {
            padding: 0.6rem 1rem;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-title-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .preview-filename {
            font-weight: bold;
            color: var(--link);
        }

        .preview-filesize {
            font-size: 0.75rem;
            color: var(--meta);
        }

        .external-btn {
            background: var(--badge-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-family: inherit;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: background 0.2s, border-color 0.2s;
            white-space: nowrap;
        }

        .external-btn:hover {
            background: var(--active-bg);
            border-color: var(--link);
            color: var(--link);
        }

        .preview-content {
            flex: 1;
            background: #1e1e1e;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .preview-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        .preview-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--meta);
            text-align: center;
            padding: 2rem;
            gap: 0.5rem;
        }

        .node {
            margin-left: 1rem;
            border-left: 1px dotted var(--border);
            padding-left: 0.4rem;
        }

        .node.root {
            margin-left: 0;
            border-left: none;
            padding-left: 0;
        }

        .folder-header {
            cursor: pointer;
            padding: 0.3rem 0.4rem;
            display: flex;
            align-items: center;
            border-radius: 4px;
            user-select: none;
            transition: background 0.2s;
        }

        .folder-header:hover {
            background: var(--hover);
        }

        .folder-icon {
            font-weight: bold;
            color: var(--folder);
            margin-right: 0.4rem;
            width: 1.2rem;
        }

        .folder-name {
            font-weight: bold;
        }

        .folder-children {
            display: none;
            padding-top: 0.15rem;
            padding-bottom: 0.15rem;
        }

        .folder-children.open {
            display: block;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.3rem 0.4rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
        }

        .file-item:hover {
            background: var(--hover);
        }

        .file-item.active {
            background: var(--active-bg);
            border-left: 2px solid var(--link);
        }

        .file-main {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .file-icon {
            color: var(--meta);
            width: 1.2rem;
        }

        .file-name-link {
            color: var(--link);
            text-decoration: none;
        }

        .file-name-link:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }

        /* Highlight index.html */
        .file-item.index-file .file-name-link {
            color: var(--accent);
            font-weight: bold;
        }

        .file-meta {
            font-size: 0.75rem;
            color: var(--meta);
            white-space: nowrap;
            margin-left: 0.5rem;
        }

        .hover-hint {
            display: none;
            font-size: 0.65rem;
            color: var(--meta);
            background: var(--badge-bg);
            padding: 1px 4px;
            border-radius: 3px;
            border: 1px solid var(--border);
        }

        .file-item:hover .hover-hint {
            display: inline-block;
        }

        .search-wrapper {
            margin: 0.4rem 0 0.4rem 0.4rem;
        }

        .search-input {
            width: calc(100% - 0.5rem);
            max-width: 260px;
            padding: 0.25rem 0.4rem;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
            font-size: 0.75rem;
            outline: none;
            border-radius: 4px;
        }

        .search-input:focus {
            border-color: var(--link);
        }

        .empty-folder {
            color: var(--meta);
            font-style: italic;
            padding: 0.3rem 0.8rem;
            font-size: 0.75rem;
        }

        .startup-prompt {
            text-align: center;
            padding: 2.5rem 1rem;
            background: var(--hover);
            border-radius: 6px;
            border: 1px dashed var(--border);
            margin-top: 1rem;
        }

        .custom-file-upload {
            display: inline-block;
            padding: 0.5rem 1rem;
            cursor: pointer;
            background: var(--text);
            color: var(--bg);
            border-radius: 4px;
            font-weight: bold;
            margin-top: 0.75rem;
            font-size: 0.8rem;
        }

        .loader {
            color: var(--link);
            font-weight: bold;
        }

        @media (max-width: 900px) {
            .workspace {
                flex-direction: column;
                overflow-y: auto;
            }
            .sidebar {
                width: 100%;
                max-height: 40vh;
                border-right: none;
                border-bottom: 1px dashed var(--border);
            }
            body {
                overflow: auto;
                height: auto;
            }
            .app-container {
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div>
                <h1 id="app-title">~/Repository_Explorer</h1>
                <div class="subtitle" id="app-subtitle">
                    <span>Auto-parsing files & live preview</span>
                    <span class="status-badge" id="mode-badge">Checking environment...</span>
                </div>
            </div>
        </header>
        
        <div class="workspace">
            <div class="sidebar" id="tree-container">
                <div class="startup-prompt">
                    <span class="loader">[ Processing Repository Contents... ]</span>
                </div>
            </div>

            <div class="preview-pane">
                <div class="preview-header">
                    <div class="preview-title-info">
                        <span class="preview-filename" id="preview-file-title">No file selected</span>
                        <span class="preview-filesize" id="preview-file-size"></span>
                    </div>
                    <a id="preview-external-link" href="#" target="_blank" class="external-btn" style="display: none;">
                        <span>Open in New Tab</span>
                        <span>&#8599;</span>
                    </a>
                </div>
                <div class="preview-content" id="preview-viewport">
                    <div class="preview-placeholder" id="preview-placeholder">
                        <div style="font-size: 1.5rem;">&#128196;</div>
                        <div>Select a file from the left tree to preview live on the right.</div>
                        <div style="font-size: 0.75rem; color: var(--meta);">Hover over any file to preview info, click to load.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function formatBytes(bytes, decimals = 2) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        }

        // Sort nodes: index.html strictly first, then folders, then files alphabetically
        function sortNodes(nodes) {
            return nodes.sort((a, b) => {
                const aIsIndex = a.name.toLowerCase() === 'index.html';
                const bIsIndex = b.name.toLowerCase() === 'index.html';

                if (aIsIndex && !bIsIndex) return -1;
                if (!aIsIndex && bIsIndex) return 1;

                if (a.type === 'folder' && b.type === 'file') return -1;
                if (a.type === 'file' && b.type === 'folder') return 1;

                return a.name.localeCompare(b.name);
            });
        }

        let activeFileElement = null;

        function loadFilePreview(node, fileItemEl) {
            // Update active state in tree
            if (activeFileElement) {
                activeFileElement.classList.remove('active');
            }
            activeFileElement = fileItemEl;
            activeFileElement.classList.add('active');

            // Update header info
            document.getElementById('preview-file-title').textContent = node.name;
            document.getElementById('preview-file-size').textContent = node.size ? formatBytes(node.size) : '';
            
            const extLink = document.getElementById('preview-external-link');
            extLink.href = node.url || '#';
            extLink.style.display = 'flex';

            // Render content in viewport
            const viewport = document.getElementById('preview-viewport');
            viewport.innerHTML = '';

            const iframe = document.createElement('iframe');
            iframe.className = 'preview-iframe';
            iframe.src = node.url;
            viewport.appendChild(iframe);
        }

        function renderNode(node, isRoot = false) {
            const wrapper = document.createElement('div');
            wrapper.className = 'node' + (isRoot ? ' root' : '');
            wrapper.dataset.name = node.name.toLowerCase();

            if (node.type === 'folder') {
                const header = document.createElement('div');
                header.className = 'folder-header';
                
                const icon = document.createElement('span');
                icon.className = 'folder-icon';
                icon.textContent = '[+]';
                
                const name = document.createElement('span');
                name.className = 'folder-name';
                name.textContent = node.name + '/';
                
                header.appendChild(icon);
                header.appendChild(name);

                const childrenContainer = document.createElement('div');
                childrenContainer.className = 'folder-children';

                header.addEventListener('click', () => {
                    const isOpen = childrenContainer.classList.toggle('open');
                    icon.textContent = isOpen ? '[-] ' : '[+]';
                });

                wrapper.appendChild(header);

                if (node.children && node.children.length > 0) {
                    const searchWrapper = document.createElement('div');
                    searchWrapper.className = 'search-wrapper';
                    
                    const searchInput = document.createElement('input');
                    searchInput.type = 'text';
                    searchInput.className = 'search-input';
                    searchInput.placeholder = `Search in ${node.name}/...`;
                    
                    searchInput.addEventListener('input', (e) => {
                        const query = e.target.value.toLowerCase();
                        Array.from(itemsWrapper.children).forEach(childWrapper => {
                            const childName = childWrapper.dataset.name || '';
                            if (childName.includes(query)) {
                                childWrapper.style.display = 'flex';
                            } else {
                                childWrapper.style.display = 'none';
                            }
                        });
                    });

                    searchWrapper.appendChild(searchInput);
                    childrenContainer.appendChild(searchWrapper);

                    const itemsWrapper = document.createElement('div');
                    const sortedChildren = sortNodes(node.children);
                    sortedChildren.forEach(child => {
                        itemsWrapper.appendChild(renderNode(child));
                    });
                    
                    childrenContainer.appendChild(itemsWrapper);
                } else {
                    const empty = document.createElement('div');
                    empty.className = 'empty-folder';
                    empty.textContent = '(empty folder)';
                    childrenContainer.appendChild(empty);
                }

                wrapper.appendChild(childrenContainer);
                
                if (isRoot) {
                    childrenContainer.classList.add('open');
                    icon.textContent = '[-]';
                }

            } else {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                if (node.name.toLowerCase() === 'index.html') {
                    fileItem.classList.add('index-file');
                }

                const mainDiv = document.createElement('div');
                mainDiv.className = 'file-main';

                const fileIcon = document.createElement('span');
                fileIcon.className = 'file-icon';
                fileIcon.innerHTML = '&#128196;';

                const nameSpan = document.createElement('span');
                nameSpan.className = 'file-name-link';
                nameSpan.textContent = node.name;

                mainDiv.appendChild(fileIcon);
                mainDiv.appendChild(nameSpan);

                const rightInfo = document.createElement('div');
                rightInfo.style.display = 'flex';
                rightInfo.style.alignItems = 'center';
                rightInfo.style.gap = '0.5rem';

                const hoverHint = document.createElement('span');
                hoverHint.className = 'hover-hint';
                hoverHint.textContent = 'click to preview';
                rightInfo.appendChild(hoverHint);

                const meta = document.createElement('span');
                meta.className = 'file-meta';
                meta.textContent = node.size ? formatBytes(node.size) : '';
                rightInfo.appendChild(meta);

                fileItem.appendChild(mainDiv);
                fileItem.appendChild(rightInfo);

                fileItem.addEventListener('click', (e) => {
                    e.stopPropagation();
                    loadFilePreview(node, fileItem);
                });

                wrapper.appendChild(fileItem);
            }

            return wrapper;
        }

        const treeContainer = document.getElementById('tree-container');
        const modeBadge = document.getElementById('mode-badge');

        async function tryGitHubAutoFetch() {
            const host = window.location.hostname;
            const pathname = window.location.pathname;

            if (host.endsWith('.github.io')) {
                const owner = host.split('.')[0];
                const repo = pathname.split('/')[1] || '';

                if (owner && repo) {
                    modeBadge.textContent = 'GitHub Pages Mode';
                    try {
                        const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/main?recursive=1`);
                        if (!response.ok) throw new Error('Repository tree fetch failed');
                        
                        const data = await response.json();
                        const root = { name: repo, type: 'folder', children: [] };
                        const pageBase = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);

                        data.tree.forEach(item => {
                            const parts = item.path.split('/');
                            let current = root;

                            parts.forEach((part, index) => {
                                const isLast = index === parts.length - 1;
                                if (isLast) {
                                    if (item.type === 'blob') {
                                        current.children.push({
                                            name: part,
                                            type: 'file',
                                            size: item.size,
                                            url: pageBase + item.path
                                        });
                                    }
                                } else {
                                    let folder = current.children.find(c => c.name === part && c.type === 'folder');
                                    if (!folder) {
                                        folder = { name: part, type: 'folder', children: [] };
                                        current.children.push(folder);
                                    }
                                    current = folder;
                                }
                            });
                        });

                        treeContainer.innerHTML = '';
                        treeContainer.appendChild(renderNode(root, true));
                        return true;
                    } catch (err) {
                        console.warn('GitHub API parsing failed, falling back to local mode', err);
                    }
                }
            }
            return false;
        }

        function renderLocalPicker() {
            modeBadge.textContent = 'Local Mode';
            treeContainer.innerHTML = `
                <div class="startup-prompt">
                    <h2 style="margin-top:0; font-size:1rem;">Local Folder Selection</h2>
                    <p style="color:var(--meta); font-size:0.75rem;">
                        Select your repository folder to explore & preview files.
                    </p>
                    <label class="custom-file-upload">
                        Browse Folder...
                        <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none;" />
                    </label>
                </div>
            `;

            document.getElementById('folderInput').addEventListener('change', (e) => {
                const files = e.target.files;
                if (files.length > 0) {
                    const root = { name: 'Current_Folder', type: 'folder', children: [] };

                    for (let i = 0; i < files.length; i++) {
                        const file = files[i];
                        const parts = file.webkitRelativePath.split('/');
                        let current = root;

                        for (let j = 0; j < parts.length; j++) {
                            const part = parts[j];
                            if (j === parts.length - 1) {
                                current.children.push({
                                    name: part,
                                    type: 'file',
                                    size: file.size,
                                    url: URL.createObjectURL(file)
                                });
                            } else {
                                let folder = current.children.find(c => c.name === part && c.type === 'folder');
                                if (!folder) {
                                    folder = { name: part, type: 'folder', children: [] };
                                    current.children.push(folder);
                                }
                                current = folder;
                            }
                        }
                    }

                    treeContainer.innerHTML = '';
                    const displayTree = (root.children.length === 1 && root.children[0].type === 'folder') ? root.children[0] : root;
                    treeContainer.appendChild(renderNode(displayTree, true));
                }
            });
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const success = await tryGitHubAutoFetch();
            if (!success) {
                renderLocalPicker();
            }
        });
    </script>
</body>
</html>
